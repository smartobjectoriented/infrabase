# meta-zephyr — Zephyr RTOS support for EDGE-M1
#
# Holds what the Zephyr environment needs that is ours rather than
# upstream's: the out-of-tree board definitions and the ITS templates.
# The Zephyr tree itself lives in zephyr/zephyr, fetched by west, and the
# applications in zephyr/usr — mirroring linux/linux + linux/usr.
#
# The board files sit under recipes-zephyr/zephyr/files/ in the layout
# Zephyr's BOARD_ROOT expects (boards/<vendor>/<board>/), so a build can
# point straight at that directory:
#
#   west build -b ib_virt64 \
#       -- -DBOARD_ROOT=<root>/build/meta-zephyr/recipes-zephyr/zephyr/files

# The board definitions here are Zephyr's own build inputs, read through
# BOARD_ROOT by west rather than by bitbake. The recipes are what make this a
# collection: mcuboot_2.4.0.bb owns the MCUboot source and the patch series
# this tree carries against it.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "zephyr"
BBFILE_PATTERN_zephyr = "^${LAYERDIR}/"
BBFILE_PRIORITY_zephyr = "5"
LAYERSERIES_COMPAT_zephyr = "infrabase_core"

# Patch series this layer maintains against the west-fetched trees, and the
# subtree each one applies to. usr-zephyr:do_patch_zephyr walks them.
#
# The trees are fetched by west into zephyr/, which is gitignored, so a patch
# is the only way for a change in them to live in this repository at all.
# Where the Zephyr environment lives, following <env>/<env> + <env>/usr.
IB_ZEPHYR_PATH ?= "${IB_DIR}/zephyr/zephyr"
IB_ZEPHYR_BOARD_ROOT ?= "${LAYERDIR}/recipes-zephyr/zephyr/files"
