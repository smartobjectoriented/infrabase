# MCUboot configuration for ib_virt64. The slots live on the virtio-blk
# disk through edgemtech,flash-disk — see ib_virt64.overlay.
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_DISK_DRIVER_VIRTIO_BLK=y
CONFIG_DISK_ACCESS=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_BOOT_MAX_IMG_SECTORS=4096

# RAM load, not execute-in-place.
#
# The slots are on a disk, and nothing executes from a disk. MCUboot reads
# the selected image out of its slot into RAM and jumps there — which is also
# what the arm64 do_boot() this tree adds is written for. The destination
# comes from the image header, written by imgtool --load-addr when the
# application is built (see ib_virt64-payload.conf).
CONFIG_BOOT_RAM_LOAD=y

# Logging. MCUboot's own INFO output is on by default and says which slot it
# chose; this adds the drivers underneath it, at error level only. Both
# failures that cost real time in the bring-up announced themselves there —
# "disk 'VBLK' will not initialise" and "disk read at sector N failed" — and
# without it MCUboot only asserted, with nothing to say why.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_FLASH_LOG_LEVEL_ERR=y
