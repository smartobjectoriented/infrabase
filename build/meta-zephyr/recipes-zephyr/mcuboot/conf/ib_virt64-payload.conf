# Kconfig for an application that boots UNDER MCUboot on ib_virt64.
#
# CONFIG_BOOTLOADER_MCUBOOT does two things: it links the image at
# slot0_partition's offset plus the MCUboot header, and it has the build sign
# the result into zephyr.signed.bin. Both need the slot, which is why this is
# paired with ib_virt64.overlay — the application is built against the
# same devicetree as the bootloader that will start it.
CONFIG_BOOTLOADER_MCUBOOT=y

# The slots live on the virtio-blk disk, so the devicetree the overlay brings
# in references a disk the application must also be able to describe, even
# though it never reads it.
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_DISK_DRIVER_VIRTIO_BLK=y
CONFIG_DISK_ACCESS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Signed for RAM load: imgtool records the load address in the header so
# MCUboot knows where to put the image. The address is this build's
# zephyr,sram — the board's sram0, the same 0x41000000 a direct AVZ boot
# would have used, so the application binary is unchanged by having a
# bootloader in front of it.
CONFIG_MCUBOOT_BOOTLOADER_MODE_RAM_LOAD=y

# MCUboot verifies against the public half it embeds; this is the private
# half of the same sample key. ${WEST_TOPDIR} is substituted by CMake —
# zephyr_mcuboot_tasks() runs the string through string(CONFIGURE).
#
# A sample key, deliberately visible as such: signing a product image is a
# key-management decision, not a build setting.
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="${WEST_TOPDIR}/bootloader/mcuboot/root-rsa-2048.pem"

# CONFIG_ROM_START_OFFSET reserves the space MCUboot's header goes in, and
# every linker script that honours it is arm/riscv/xtensa — arm64 has none.
# So the image does not start with 0x200 zero bytes and imgtool refuses to
# overwrite real code ("Header padding was not requested and image does not
# start with zeros"). --pad-header has imgtool prepend the header instead of
# writing it into space the linker was supposed to leave.
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--pad-header"
