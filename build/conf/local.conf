# Infrabase - Main configuration
#
# Copyright (c) 2025-2026 EDGEMTech SA
#
# THE configuration file: everything a build depends on is an IB_* variable
# set here. Platform CAPABILITIES (which chains / hypervisors each board can
# run at all) are facts rather than choices and live next door, in
# and are grouped with the axes they constrain.

BB_NUMBER_THREADS = "20"

# ============================================================================
#                                 PLATFORM
# ============================================================================
# Main target physical/emulated hardware.

# IB_PLATFORM ?= "virt32"
IB_PLATFORM ?= "virt64"
# IB_PLATFORM ?= "rpi4"
# IB_PLATFORM ?= "rpi4_64"
# IB_PLATFORM ?= "verdin-imx8mp"
# IB_PLATFORM ?= "x86-qemu"

# On the QEMU-emulated platforms (virt32/virt64) a full BSP build also builds
# the QEMU emulator when its binary is still missing, so a fresh tree is
# runnable (st.sh) without a separate `build.sh qemu`. Set to "0" to skip that
# (e.g. CI that only builds and deploys). Ignored on hardware platforms.
IB_BUILD_QEMU ?= "1"

# ============================================================================
#                            WHAT TO BUILD: THE CHAIN
# ============================================================================
# Infrabase builds atf, optee, avz and linux. Which of them end up in an
# image is decided by ONE variable: IB_BOOT_CHAIN names every stage that runs
# before the payload, in the order it runs, joined by "+":
#
#     atf + optee + uboot + avz + mcuboot
#
#   atf      ARM Trusted Firmware, BL1 + BL2 + BL31.
#   optee    OP-TEE as BL32, the secure world. Needs atf.
#   uboot    U-Boot.
#   avz      the AVZ hypervisor at EL2, entered by U-Boot's guest-boot — so
#            it needs uboot, and cannot precede it in the string.
#   mcuboot  MCUboot, which picks an image out of a flash slot and runs it.
#
# So "uboot" is bare U-Boot with Linux on top, "atf+optee+uboot" is a bare
# build WITH a secure world, "uboot+avz" is Linux as an AVZ guest on a plain
# U-Boot chain, and "atf+optee+uboot+avz" is the edge-m1 capsule chain.
#
# The order is checked, not just the spelling: "atf+avz+uboot" is refused. A
# chain must contain uboot or mcuboot, or nothing can enter a payload.
#
# Everything else about the boot shape is DERIVED from this one value by
# base.bbclass:ib_normalize_boot_axes — IB_HYPERVISOR, the IB_CHAIN_HAS_<STAGE>
# flags the recipes gate on, and which ITS is assembled (the platform's _avz
# bundle whenever AVZ is in the chain). Nothing else has to be set, and
# nothing can disagree with it.
#
# "full" is still accepted as a legacy alias of "atf+optee+uboot+avz" (the
# edge-m1 capsule chain), so a tree aligning onto this one keeps working.

IB_BOOT_CHAIN ?= "uboot"

# --- What each platform can actually run ---
#
# Declared as a SET OF STAGES, not as a list of whole chains: the chain is an
# ordered list, so enumerating chains would mean enumerating every combination
# of the stages a platform allows, and forgetting one refuses a build that
# works. These are hardware and upstream facts rather than preferences, and a
# build naming a stage absent from them is refused at parse time by
# ib_normalize_boot_axes() (meta/classes/base.bbclass) with a message naming
# what the platform does support — instead of failing much later in a firmware
# link, or booting a board that then stays silent.

# QEMU virt (armv8). The reference platform: everything is exercised here,
# ATF and OP-TEE both being upstream-supported on PLAT=qemu /
# PLATFORM=vexpress-qemu_armv8a, and virtualization=on giving EL2 for AVZ.
IB_BOOT_STAGES_SUPPORTED:virt64 = "atf optee uboot avz mcuboot"

# QEMU virt (armv7). No ATF port wired in this tree, and no EL2.
IB_BOOT_STAGES_SUPPORTED:virt32 = "uboot"

# Raspberry Pi 4, 32-bit. TF-A's plat/rpi/rpi4 is AArch64-only (BL31 is an
# armv8 binary loaded as the armstub), so a 32-bit Pi build has no ATF
# option at all, and no EL2 for AVZ.
IB_BOOT_STAGES_SUPPORTED:rpi4 = "uboot"

# Raspberry Pi 4, 64-bit. TF-A supports rpi4 in RESET_TO_BL31 mode (the GPU
# firmware loads bl31.bin as the armstub at 0x0), hence "atf".
#
# OP-TEE is deliberately ABSENT and will stay so: it has no plat-rpi4
# upstream (only rpi3 and rpi5), and the BCM2711 has no secure memory
# controller — every "secure" region is plain DRAM readable from the normal
# world, so an OP-TEE there could never be a real TEE, only a boot-chain
# exerciser. Use virt64 or verdin-imx8mp for a secure world; the rpi5 is the
# Raspberry target with an upstream OP-TEE platform.
IB_BOOT_STAGES_SUPPORTED:rpi4_64 = "atf uboot avz"

# Toradex Verdin iMX8MP.
IB_BOOT_STAGES_SUPPORTED:verdin-imx8mp = "atf optee uboot avz"

# The i.MX8M Plus boot ROM loads the SPL, which always installs BL31 before
# U-Boot — there is no bare-U-Boot chain on this SoC, so "atf" is not merely
# supported here, it is mandatory.
IB_BOOT_STAGES_REQUIRED:verdin-imx8mp = "atf"

IB_BOOT_STAGES_SUPPORTED:x86-qemu = "uboot"

# Fallback for a platform not listed above: refuse everything but the
# plainest chain rather than silently pretending it works.
IB_BOOT_STAGES_SUPPORTED ?= "uboot"

# ============================================================================
#                                    AVZ
# ============================================================================
# The AVZ hypervisor is fetched from the SO3 repository and built with a
# per-platform defconfig. Only used when IB_HYPERVISOR = "avz"; the recipe is
# not pulled into the build otherwise.
#
# The SO3 revision AVZ is built from is pinned IN THE RECIPE
# (meta-so3/recipes-so3/avz/avz_<PV>.bb: SRCREV + IB_SO3_TAG), not here — a
# version bump is a tracked change, not a local setting.

PREFERRED_VERSION_avz:virt64        = "6.3.1"
PREFERRED_VERSION_avz:rpi4_64       = "6.3.1"
PREFERRED_VERSION_avz:verdin-imx8mp = "6.3.1"

# AVZ build configs. The *_avz_soo_defconfig variants (CONFIG_SOO=y) belong to
# the SOO/capsule product trees; the plain Linux guest this tree boots needs
# only the base AVZ config.
IB_CONFIG:avz:virt64        ?= "virt64_avz_defconfig"
IB_CONFIG:avz:rpi4_64       ?= "rpi4_64_avz_defconfig"
IB_CONFIG:avz:verdin-imx8mp ?= "verdin-imx8mp_avz_defconfig"

# ============================================================================
#                                   LINUX
# ============================================================================

# --- Versions ---
PREFERRED_VERSION_linux:virt32        = "6.12"
PREFERRED_VERSION_linux:virt64        = "6.12"
PREFERRED_VERSION_linux:rpi4          = "6.12-rpi4"
PREFERRED_VERSION_linux:rpi4_64       = "6.12-rpi4"
PREFERRED_VERSION_linux:x86-qemu      = "6.12"
PREFERRED_VERSION_linux:verdin-imx8mp = "6.6-verdin"
PREFERRED_VERSION_linux = "${PREFERRED_VERSION_linux:${IB_PLATFORM}}"

# --- Configs (kernel defconfig) ---
IB_CONFIG:linux:virt32        ?= "virt32_defconfig"
IB_CONFIG:linux:virt64        ?= "virt64_defconfig"
# rpi4 32-bit: the fork's own armv7 bcm2711 config.
IB_CONFIG:linux:rpi4          ?= "bcm2711_defconfig"
# IB_CONFIG:linux:rpi4_64     ?= "rpi4_64_defconfig"
IB_CONFIG:linux:rpi4_64       ?= "rpi4_64_nomodules_defconfig"
IB_CONFIG:linux:verdin-imx8mp ?= "verdin_imx8mp_defconfig"
IB_CONFIG:linux:x86-pc        ?= "x86_defconfig"
IB_CONFIG:linux:x86-qemu      ?= "x86_qemu_defconfig"

# --- ITS (boot-image selection) ---
# The BARE value: "<plat>", what this BSP boots with no hypervisor under it.
# base.bbclass swaps in the platform's "<plat>_avz" bundle whenever AVZ is in
# the chain (do_render_its then also renders the matching "<plat>_linux_guest"),
# so nothing here mentions the hypervisor and the two cannot disagree — an ITS
# naming one shape while the chain names the other produces an image that boots
# nothing, with no error.
#
# Unscoped on purpose. An "IB_TARGET_ITS:linux" would win over that derivation
# in the bsp-linux scope, because getVar() resolves overrides while setVar()
# writes the base name only — and the _avz bundle would then silently never be
# selected. Override per platform below only for a hand-written ITS whose name
# does not follow the rule.

IB_TARGET_ITS ?= "${IB_PLATFORM}"

# --- Embedded ramfs source ---
# Which cpio is gzipped into the ITB as the boot-time initramfs.
#   "rootfs" (default) - the freshly built board/<plat>/rootfs.cpio (full
#                        buildroot rootfs), run entirely from RAM; p2 holds
#                        the same content.
#   "initrd"           - the static git-tracked board/<plat>/initrd.cpio
#                        (small busybox ramfs) whose /init pivots to the full
#                        ext4 rootfs on p2 via switch_root.
IB_RAMFS_SOURCE ?= "rootfs"

# ============================================================================
#                              ATF / OP-TEE
# ============================================================================
# Only consulted on the chains that carry them. Platform identifiers are the
# upstream PLAT= / PLATFORM= names.

IB_ATF_PLAT:virt64        = "qemu"
IB_ATF_PLAT:verdin-imx8mp = "imx8mp"
# TF-A names the Raspberry Pi 4 platform "rpi4" for both. BL31-only
# (RESET_TO_BL31): the GPU firmware loads bl31.bin as the armstub.
IB_ATF_PLAT:rpi4_64       = "rpi4"

IB_OPTEE_PLAT:virt64        = "vexpress-qemu_armv8a"
IB_OPTEE_PLAT:verdin-imx8mp = "imx-mx8mpevk"
# No IB_OPTEE_PLAT for rpi4_64 on purpose: OP-TEE has no plat-rpi4 upstream
# and the BCM2711 has no secure memory controller. See
# IB_BOOT_STAGES_SUPPORTED above.

# virt64: SPD=opteed only on a chain that carries OP-TEE (BL2 then loads
# BL32 = OP-TEE from the FIP). Without it the FIP carries BL31+U-Boot only —
# leaving SPD=opteed makes BL2 hang on "Loading image id 4" because there is
# no BL32 entry to load. SPD must be dropped so BL2 jumps straight from BL31
# to BL33 (U-Boot).
IB_ATF_EXTRA_OPTS:virt64 = "${@'SPD=opteed ' if d.getVar('IB_CHAIN_HAS_OPTEE') else ''}LOG_LEVEL=40"

# verdin: same reasoning. BL32_BASE/BL32_SIZE describe where the SPL places
# OP-TEE, and are meaningless — and SPD=opteed actively harmful — when the
# chain carries no BL32.
IB_ATF_EXTRA_OPTS:verdin-imx8mp = "IMX_BOOT_UART_BASE=0x30880000 ${@'SPD=opteed BL32_BASE=0xbe000000 BL32_SIZE=0x2000000 ' if d.getVar('IB_CHAIN_HAS_OPTEE') else ''}DEBUG=0 LOG_LEVEL=20"

# rpi4_64: the upstream port has, in its own words, "no real configuration
# options" — one universal bl31.bin. Left empty deliberately.
IB_ATF_EXTRA_OPTS:rpi4_64 = ""

# Verdin iMX8MP has 2 GB DRAM (0x40000000-0xBFFFFFFF).
# TZDRAM 30MB (0xbe000000-0xbfdfffff) + SHMEM 2MB (0xbfe00000-0xbfffffff) =
# top 32MB of 2GB DRAM. CFG_TZDRAM_SIZE keeps its default 0x1e00000 (30MB) so
# SHMEM fits within DRAM (it would overflow at 0xc0000000).
IB_OPTEE_EXTRA_OPTS:verdin-imx8mp = "CFG_TZDRAM_START=0xbe000000 CFG_DDR_SIZE=0x80000000 CFG_TEE_CORE_LOG_LEVEL=3 CFG_UART_BASE=0x30880000"

# ============================================================================
#                       Component versions (per platform)
# ============================================================================

# rootfs (built once the user apps are deployed into it)
PREFERRED_VERSION_rootfs-linux:virt64   = "1.0"
PREFERRED_VERSION_rootfs-linux:rpi4     = "1.0"
PREFERRED_VERSION_rootfs-linux:rpi4_64  = "1.0"
PREFERRED_VERSION_rootfs-linux:x86-qemu = "1.0"

PREFERRED_VERSION_buildroot:virt64  = "2024.11"
PREFERRED_VERSION_buildroot:rpi4    = "2024.11"
PREFERRED_VERSION_buildroot:rpi4_64 = "2024.11"

# bsp (deployed from the host to the target)
PREFERRED_VERSION_bsp-linux:virt64   = "1.0"
PREFERRED_VERSION_bsp-linux:rpi4     = "1.0"
PREFERRED_VERSION_bsp-linux:rpi4_64  = "1.0"
PREFERRED_VERSION_bsp-linux:x86-qemu = "1.0"

# U-Boot. The QEMU virt and Raspberry platforms use 2022.04 (the recipe that
# carries their defconfigs); verdin needs 2024.07, which assembles
# imx-boot/flash.bin (SPL + ATF + optionally OP-TEE + U-Boot). Without an
# explicit pin, bitbake would default to the newest recipe (2024.07) whose
# 32-bit startup does not build for virt32/rpi4.
PREFERRED_VERSION_uboot:virt32        = "2022.04"
PREFERRED_VERSION_uboot:virt64        = "2022.04"
PREFERRED_VERSION_uboot:rpi4          = "2022.04"
PREFERRED_VERSION_uboot:rpi4_64       = "2022.04"
PREFERRED_VERSION_uboot:verdin-imx8mp = "2024.07"

# user-space apps
PREFERRED_VERSION_usr-linux:virt64   = "1.0"
PREFERRED_VERSION_usr-linux:rpi4     = "1.0"
PREFERRED_VERSION_usr-linux:rpi4_64  = "1.0"
PREFERRED_VERSION_usr-linux:x86-qemu = "1.0"

# NXP lpddr4 DDR training firmware, vendored in one flat directory.
IB_IMX_FIRMWARE_PATH = "${IB_DIR}/build/meta-bsp/recipes-bsp/bsp/verdin-imx8mp"

# imx-boot's U-Boot hands the OS off at EL2, which is what AVZ needs and what
# the Linux arm64 boot protocol expects (the kernel does its own el2_setup and
# drops to EL1). Set to "1" only for a payload that must be entered at EL1.
IB_UBOOT_SWITCH_EL1 ?= "0"

# ============================================================================
#                            Storage / deployment
# ============================================================================
# Type of deployment (soft for virtual storage, hard for target hardware)
# !! BE VERY CAREFUL WITH THIS VARIABLE !!

IB_STORAGE_MODE:virt32 ?= "soft"
IB_STORAGE_MODE:virt64 ?= "soft"
IB_STORAGE_MODE:rpi4 ?= "hard"
IB_STORAGE_MODE:rpi4_64 ?= "hard"
# Verdin: deploy imx-boot + the ITB(s) via a TEZI image set served over HTTP.
IB_STORAGE_MODE:verdin-imx8mp ?= "http"
# IB_STORAGE_MODE:verdin-imx8mp ?= "hard"
# IB_STORAGE_MODE ?= "remote"

# Physical device used when IB_STORAGE_MODE = "hard". No default ON PURPOSE:
# the storage init partitions and formats it unconditionally, and a wrong or
# default device (e.g. /dev/sda) would overwrite a host disk.
IB_STORAGE_DEVICE:rpi4 = "mmcblk0"
IB_STORAGE_DEVICE:rpi4_64 = "mmcblk0"
# IB_STORAGE_DEVICE:verdin-imx8mp = "sda"

# HTTP deploy path: TEZI files are placed here for TEZI network auto-install,
# and scripts/tezi-feed-serve.sh serves this directory over HTTP.
#
# Tree-relative on purpose: this file is tracked, so it must not carry a
# machine-specific absolute path. Keeping the feed inside the tree also means
# it is already visible to the build container (dbuild.sh bind-mounts the
# tree) and writable by the calling user, so publishing needs no sudo.
# Under build/deploy/ rather than build/tmp/ so a clean does not wipe a feed
# a board may be about to pull from.
#
# To publish elsewhere on one machine, override this in build/conf/site.conf
# (untracked, loaded after this file).
IB_HTTP_DEPLOY_PATH ?= "${IB_DIR}/build/deploy/tezi/${IB_PLATFORM}"

# Port scripts/tezi-feed-serve.sh listens on. Unprivileged so the feed server
# runs as your user; override in site.conf when two trees share a machine.
IB_HTTP_FEED_PORT ?= "8080"

# Size of the storage image
IB_ROOTFS_SIZE ?= "2G"

# Size of the FAT boot partition (p1), which holds the ITB(s). A Linux ITB
# carries a kernel plus an initramfs, and the AVZ shape needs two of them
# (hypervisor + guest), hence the headroom. Only applied when the storage is
# (re)initialised.
IB_BOOT_PARTITION_SIZE ?= "256M"

# Target partition for the main rootfs
IB_ROOTFS_PARTITION:virt32 = "p2"
IB_ROOTFS_PARTITION:virt64 = "p2"
IB_ROOTFS_PARTITION:rpi4 = "p2"
IB_ROOTFS_PARTITION:rpi4_64 = "p2"
IB_ROOTFS_PARTITION:x86-qemu = "p1"

IB_ROOTFS_PATH:linux = "${IB_DIR}/linux/rootfs"

IB_ROOTFS_METHOD ?= "buildroot"
# IB_ROOTFS_METHOD ?= "debootstrap"

# ============================================================================
#                           CPU core and toolchain
# ============================================================================

IB_PLAT_CPU:virt32 = "arm"
IB_PLAT_CPU:rpi4 = "arm"

IB_PLAT_CPU:virt64 = "aarch64"
IB_PLAT_CPU:rpi4_64 = "aarch64"
IB_PLAT_CPU:verdin-imx8mp = "aarch64"
IB_PLAT_CPU:x86-qemu = "x86"

IB_TOOLCHAIN:arm = "arm-linux-gnueabihf"
IB_TOOLCHAIN:virt64 = "aarch64-none-linux-gnu"
IB_TOOLCHAIN:rpi4_64 = "aarch64-none-linux-gnu"
IB_TOOLCHAIN:verdin-imx8mp = "aarch64-none-linux-gnu"

# Debug options
IB_USR_BUILD_TYPE = "Release"

BB_NO_NETWORK_SANDBOX = "1"
BB_WARN_ONLY = "true"

# EXTRA_OVERRIDES enables fine-grained customization for the various IB recipes.
EXTRA_OVERRIDES .= ":lvgl"
